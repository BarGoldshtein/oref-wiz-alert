<!DOCTYPE html>
<html lang="he" dir="rtl" id="root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrefAlert — הגדרות</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #0f0f0f;
    --surface:  #1a1a1a;
    --border:   #2a2a2a;
    --text:     #e8e8e8;
    --muted:    #888;
    --green:    #22c55e;
    --red:      #ef4444;
    --amber:    #f59e0b;
    --blue:     #3b82f6;
    --radius:   10px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    padding-bottom: 40px;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  header h1 { font-size: 17px; font-weight: 600; }

  #status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  #status-dot.ok    { background: var(--green); }
  #status-dot.alert { background: var(--red); animation: pulse 0.6s infinite; }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.3; }
  }

  #status-text { font-size: 13px; color: var(--muted); margin-right: auto; }

  main { max-width: 600px; margin: 0 auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }

  .card-header {
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .card-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

  label { font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
  label span { color: var(--muted); font-size: 12px; }

  input[type="text"], input[type="url"], select {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    padding: 9px 12px;
    font-size: 14px;
    width: 100%;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--blue); }

  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .toggle-row label { flex: 1; flex-direction: row; align-items: center; }

  .switch {
    position: relative; width: 44px; height: 24px; flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0;
    background: var(--border);
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.2s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 18px; height: 18px;
    left: 3px; top: 3px;
    background: white;
    border-radius: 50%;
    transition: transform 0.2s;
  }
  input:checked + .slider { background: var(--green); }
  input:checked + .slider::before { transform: translateX(20px); }

  .btn {
    padding: 9px 16px;
    border-radius: 7px;
    border: none;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }
  .btn:active { opacity: 0.7; }
  .btn-primary { background: var(--blue); color: white; }
  .btn-success { background: var(--green); color: white; }
  .btn-danger  { background: var(--red); color: white; }
  .btn-ghost   { background: var(--border); color: var(--text); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .row { display: flex; gap: 8px; align-items: flex-end; }
  .row > *:first-child { flex: 1; }

  /* Bulb list */
  #bulb-list { display: flex; flex-direction: column; gap: 8px; }
  .bulb-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 10px 12px;
  }
  .bulb-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); flex-shrink: 0;
  }
  .bulb-dot.connected { background: var(--green); }
  .bulb-info { flex: 1; min-width: 0; }
  .bulb-addr { font-size: 13px; font-family: monospace; }
  .bulb-name { font-size: 11px; color: var(--muted); }
  .bulb-remove { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 4px; }
  .bulb-remove:hover { color: var(--red); }

  /* Scan results */
  #scan-results {
    display: none;
    flex-direction: column;
    gap: 6px;
    margin-top: 8px;
    max-height: 200px;
    overflow-y: auto;
  }
  .scan-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 7px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .scan-item:hover { border-color: var(--blue); }
  .scan-item-info { font-size: 12px; }
  .scan-item-name { font-weight: 500; }
  .scan-item-addr { color: var(--muted); font-family: monospace; }

  /* Pattern editor */
  .pattern-grid { display: flex; flex-direction: column; gap: 10px; }
  .pattern-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .pattern-label {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 180px;
    flex-shrink: 0;
  }
  .cat-dot {
    width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
  }
  .pattern-select { flex: 1; }

  /* Log */
  #log-container {
    background: #0a0a0a;
    border-radius: 7px;
    padding: 10px;
    height: 220px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .log-line { display: flex; gap: 8px; }
  .log-ts    { color: var(--muted); flex-shrink: 0; }
  .log-level { flex-shrink: 0; width: 48px; }
  .log-level.INFO    { color: var(--blue); }
  .log-level.WARNING { color: var(--amber); }
  .log-level.ERROR   { color: var(--red); }
  .log-msg   { color: var(--text); word-break: break-word; }

  /* Save bar */
  #save-bar {
    display: none;
    position: sticky;
    bottom: 16px;
    margin: 0 16px;
    background: var(--blue);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  #save-bar span { font-size: 14px; }

  .tag {
    display: inline-block;
    padding: 2px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .tag-green { background: rgba(34,197,94,0.15); color: var(--green); }
  .tag-red   { background: rgba(239,68,68,0.15);  color: var(--red); }

  /* City search */
  #city-input { cursor: text; }
  #city-datalist option { background: var(--surface); color: var(--text); }

  .section-note { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div id="status-dot"></div>
  <h1>OrefAlert</h1>
  <span id="status-text" data-state="">טוען...</span>
  <select id="lang-select" onchange="setLang(this.value)"
    style="background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 8px;font-size:13px;cursor:pointer">
    <option value="he">עברית</option>
    <option value="ru">Русский</option>
  </select>
</header>

<main>

  <!-- ─── Bulbs ─────────────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header" id="card-bulbs">נורות Bluetooth</div>
    <div class="card-body">
      <div id="bulb-list"></div>

      <div class="row">
        <button class="btn btn-ghost" id="btn-scan" onclick="scanBLE()">סרוק נורות</button>
        <button class="btn btn-ghost" id="btn-test-flash" onclick="testFlash()">בדיקת הבהוב</button>
      </div>

      <div id="scan-spinner" style="display:none; color:var(--muted); font-size:13px;">סורק... (10 שניות)</div>
      <div id="scan-results"></div>
    </div>
  </div>

  <!-- ─── City ──────────────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header" id="card-city">עיר ואזור</div>
    <div class="card-body">
      <label>
        עיר
        <input type="text" id="city-input" list="city-list" placeholder="הקלד שם עיר..." value="{{ config.my_city }}">
        <datalist id="city-list"></datalist>
      </label>
      <div class="toggle-row">
        <label id="label-all-country">כל הארץ (ביטול סינון עיר)</label>
        <label class="switch">
          <input type="checkbox" id="all-country" {% if config.all_country %}checked{% endif %} onchange="markDirty()">
          <span class="slider"></span>
        </label>
      </div>

    </div>
  </div>

  <!-- ─── Push ──────────────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header" id="card-push">התרעות Push</div>
    <div class="card-body">
      <label id="label-ntfy">
        ntfy.sh topic
        <span id="span-ntfy-desc">צור topic חינמי בלי הרשמה — הכנס שם ייחודי</span>
        <div class="row">
          <input type="text" id="ntfy-topic" placeholder="למשל: oref-alert-mybuildingname" value="{{ config.ntfy_topic }}">
          <button class="btn btn-ghost" id="btn-test-push" onclick="testPush()">בדוק</button>
        </div>
      </label>
      <p class="section-note" id="span-ntfy-note">התקן את אפליקציית ntfy.sh ועקוב אחר ה-topic שהגדרת. ההתרעה תגיע לכל מכשיר שמנוי ל-topic.</p>
    </div>
  </div>


  <!-- ─── Idle light control ────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header" id="card-idle">שליטה בנורה — מצב רגיל</div>
    <div class="card-body">
      <div class="toggle-row">
        <label id="label-bulb-on">נורה דולקת</label>
        <label class="switch"><input type="checkbox" id="idle-on" checked onchange="setIdlePower(this.checked)"><span class="slider"></span></label>
      </div>
      <label>צבע<input type="color" id="idle-color" value="#ffc878" style="width:100%;height:40px;border:1px solid var(--border);border-radius:7px;background:var(--bg);cursor:pointer;padding:2px 4px" oninput="previewIdle()"></label>
      <label>עוצמה: <span id="idle-bv">15%</span><input type="range" id="idle-brightness" min="1" max="100" value="15" oninput="document.getElementById('idle-bv').textContent=this.value+'%'; previewIdle()"></label>
      <button class="btn btn-primary" id="btn-apply-idle" onclick="saveIdle()">החל על הנורה</button>
    </div>
  </div>

  <!-- ─── Alert colors ────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header" id="card-alert-colors">צבע ועוצמה לפי סוג התרעה</div>
    <div class="card-body"><div id="alert-color-grid"></div><button class="btn btn-primary" style="margin-top:8px" id="btn-save-colors" onclick="saveAlertColors()">שמור צבעי התרעה</button></div>
  </div>

  <!-- ─── Flash patterns ────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header" id="card-patterns">תבניות הבהוב</div>
    <div class="card-body">
      <div class="pattern-grid" id="pattern-grid"></div>
    </div>
  </div>

  <!-- ─── Log ───────────────────────────────────────────────────────────── -->
  <div class="card">
    <div class="card-header" id="card-log">יומן חי</div>
    <div class="card-body" style="gap:10px">
      <div id="log-container"></div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost" style="font-size:12px" id="btn-clear-log" onclick="document.getElementById('log-container').innerHTML=''">נקה</button>
        <button class="btn btn-ghost" style="font-size:12px" id="btn-download-log" onclick="downloadLog()">הורד יומן</button>
      </div>
    </div>
  </div>

</main>

<!-- Save bar -->
<div id="save-bar">
  <span id="save-bar-text">יש שינויים שלא נשמרו</span>
  <button class="btn btn-success" id="btn-save" onclick="saveConfig()">שמור</button>
</div>

<!-- City datalist populated from JS -->
<script>
const CITIES = ["אבו גוש","אבו סנאן","אופקים","אור יהודה","אור עקיבא","אורנית","אילת","אלעד","אפרת","אריאל","אשדוד","אשקלון","באר שבע","באר שבע - דרום","באר שבע - מזרח","באר שבע - מערב","באר שבע - צפון","בית דגן","בית שאן","בית שמש","בני ברק","בנימינה-גבעת עדה","גבעת זאב","גבעת שמואל","גבעתיים","גדרה","גן יבנה","דימונה","הוד השרון","הרצליה","הרצליה - מזרח","הרצליה - מערב","חדרה","חולון","חיפה - כרמל ועיר תחתית","חיפה - מפרץ","חיפה - נווה שאנן ורמות","חיפה - קריות","טבריה","טייבה","טירה","טירת כרמל","יבנה","יהוד-מונוסון","יוקנעם עילית","ירוחם","ירושלים","ירושלים - דרום","ירושלים - מזרח","ירושלים - מערב","ירושלים - צפון","כפר סבא","כפר קאסם","כרמיאל","לוד","מודיעין-מכבים-רעות","מגדל העמק","מעלה אדומים","מעלות-תרשיחא","מצפה רמון","נהריה","נוף הגליל","נחל עוז","נס ציונה","נצרת","נשר","נתיבות","נתניה","נתניה - מזרח","נתניה - מערב","נתניה - צפון","עומר","עפולה","ערד","פתח תקווה","פתח תקווה - דרום","פתח תקווה - מזרח","פתח תקווה - מערב","צפת","קרית אונו","קרית אתא","קרית ביאליק","קרית גת","קרית מלאכי","קרית מוצקין","קרית שמונה","ראש העין","ראשון לציון","ראשון לציון - מזרח","ראשון לציון - מערב","רהט","רחובות","רמלה","רמת גן","רמת גן - מזרח","רמת גן - מערב","רמת השרון","רעננה","שדרות","שוהם","תל אביב - דרום","תל אביב - מזרח","תל אביב - מרכז העיר","תל אביב - צפון","תל מונד"];

const ALERT_CATS = [
  { cat: "1",   name: "ירי רקטות",       color: "#ef4444" },
  { cat: "2",   name: "ירי לא מזוהה",    color: "#ef4444" },
  { cat: "3",   name: "חומרים רדיואקטיביים", color: "#10b981" },
  { cat: "4",   name: "חדירת מחבלים",    color: "#22c55e" },
  { cat: "5",   name: "רעידת אדמה",      color: "#a855f7" },
  { cat: "6",   name: "חדירת כלי טיס",   color: "#f97316" },
  { cat: "7",   name: "אירוע כימי",      color: "#eab308" },
  { cat: "8",   name: "צונאמי",          color: "#3b82f6" },
  { cat: "13",  name: "פיגוע",           color: "#ef4444" },
  { cat: "101", name: "תרגיל",           color: "#06b6d4" },
  { cat: "pre_alert", name: "התרעה מקדימה", color: "#eab308" },
  { cat: "all_clear",  name: "האירוע הסתיים",  color: "#22c55e" },
];

const DEFAULT_DURATIONS = {
  "1": 60, "2": 60, "3": 45, "4": 45, "5": 30, "6": 30,
  "7": 30, "8": 30, "13": 60, "101": 15, "pre_alert": 20, "all_clear": 10
};

const PATTERNS = ["fast_strobe", "medium_strobe", "slow_pulse", "solid"];
const PATTERN_LABELS = {
  fast_strobe:    "סטרוב מהיר (רקטות)",
  medium_strobe:  "סטרוב בינוני",
  slow_pulse:     "פולס איטי",
  solid:          "צבע קבוע",
};

let dirty = false;
let configCache = {};
let bulbStatus = {};

// ─── Init ────────────────────────────────────────────────────────────────────
async function init() {
  populateCityList();
  await loadConfig();
  renderPatternGrid();
  await refreshBulbStatus();
  renderAlertColorGrid();
  loadIdleFromConfig();
  connectSSE();
  setInterval(refreshBulbStatus, 10000);
  document.getElementById("city-input").addEventListener("input", markDirty);
  document.getElementById("ntfy-topic").addEventListener("input", markDirty);
  document.getElementById("lang-select").value = currentLang;
  setLang(currentLang);
}

function populateCityList() {
  const dl = document.getElementById("city-list");
  CITIES.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    dl.appendChild(opt);
  });
}

async function loadConfig() {
  const res = await fetch("/api/config");
  configCache = await res.json();
  renderPatternGrid();
  renderAlertColorGrid();
  loadIdleFromConfig();
}

function markDirty() {
  dirty = true;
  document.getElementById("save-bar").style.display = "flex";
}

// ─── Bulbs ───────────────────────────────────────────────────────────────────
async function refreshBulbStatus() {
  try {
    const res = await fetch("/api/ble/status");
    const data = await res.json();
    bulbStatus = {};
    data.bulbs.forEach(b => { bulbStatus[b.address] = b.connected; });

    const dot = document.getElementById("status-dot");
    const txt = document.getElementById("status-text");
    if (data.connected_count > 0) {
      dot.className = "ok";
      txt.dataset.state = "ok";
      txt.textContent = `${data.connected_count} ${t("bulbConnected")}`;
    } else {
      dot.className = "";
      txt.dataset.state = "";
      txt.textContent = t("noBulbsConnected");
    }
    renderBulbList();
  } catch(e) {}
}

function renderBulbList() {
  const addresses = configCache.ble_addresses || [];
  const container = document.getElementById("bulb-list");
  if (addresses.length === 0) {
    container.innerHTML = `<p style="color:var(--muted);font-size:13px;">${t('noBulbs')}</p>`;
    return;
  }
  container.innerHTML = addresses.map((addr, i) => `
    <div class="bulb-item">
      <div class="bulb-dot ${bulbStatus[addr] ? 'connected' : ''}"></div>
      <div class="bulb-info">
        <div class="bulb-addr">${addr}</div>
        <div class="bulb-name">${bulbStatus[addr] ? t('connected') : t('notConnected')}</div>
      </div>
      <button class="bulb-remove" onclick="removeBulb('${addr}')" title="הסר">×</button>
    </div>
  `).join("");
}

async function addBulb(address, name) {
  const addresses = [...(configCache.ble_addresses || [])];
  if (addresses.includes(address)) return;
  addresses.push(address);
  const res = await fetch("/api/config/bulbs", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ ble_addresses: addresses }),
  });
  const data = await res.json();
  if (data.ok) {
    configCache.ble_addresses = data.ble_addresses;
    renderBulbList();
    document.getElementById("scan-results").style.display = "none";
  }
}

async function removeBulb(address) {
  const addresses = (configCache.ble_addresses || []).filter(a => a !== address);
  const res = await fetch("/api/config/bulbs", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ ble_addresses: addresses }),
  });
  const data = await res.json();
  if (data.ok) {
    configCache.ble_addresses = data.ble_addresses;
    renderBulbList();
  }
}

// ─── BLE scan ────────────────────────────────────────────────────────────────
async function scanBLE() {
  const btn = document.getElementById("btn-scan");
  const spinner = document.getElementById("scan-spinner");
  const results = document.getElementById("scan-results");
  btn.disabled = true;
  spinner.style.display = "block";
  results.style.display = "none";
  results.innerHTML = "";

  try {
    const res = await fetch("/api/scan/ble", { method: "POST" });
    const data = await res.json();
    spinner.style.display = "none";

    if (data.error) {
      results.innerHTML = `<p style="color:var(--red);font-size:13px;">שגיאה: ${data.error}</p>`;
      results.style.display = "flex";
    } else if (data.devices.length === 0) {
      results.innerHTML = `<p style="color:var(--muted);font-size:13px;">לא נמצאו מכשירים</p>`;
      results.style.display = "flex";
    } else {
      results.style.display = "flex";
      data.devices.forEach(d => {
        const el = document.createElement("div");
        el.className = "scan-item";
        el.innerHTML = `
          <div class="scan-item-info">
            <div class="scan-item-name">${d.name}</div>

        `;
        results.appendChild(el);
      });
    }
  } catch(e) {
    spinner.style.display = "none";
    results.innerHTML = `<p style="color:var(--red);font-size:13px;">שגיאת רשת</p>`;
    results.style.display = "flex";
  }
  btn.disabled = false;
}

  const res = await fetch("/api/config", {

}

// ─── SSE log ─────────────────────────────────────────────────────────────────
function connectSSE() {
  const container = document.getElementById("log-container");
  const es = new EventSource("/api/log/stream");
  es.onmessage = e => {
    try {
      const entry = JSON.parse(e.data);
      const line = document.createElement("div");
      line.className = "log-line";
      line.innerHTML = `
        <span class="log-ts">${entry.ts}</span>
        <span class="log-level ${entry.level}">${entry.level}</span>
        <span class="log-msg">${entry.msg}</span>
      `;
      container.appendChild(line);
      container.scrollTop = container.scrollHeight;
      // Keep max 300 lines
      while (container.children.length > 300) {
        container.removeChild(container.firstChild);
      }
    } catch(e) {}
  };
  es.onerror = () => {
    setTimeout(connectSSE, 3000);
    es.close();
  };
}


// ─── Idle light control ────────────────────────────────────────────────────
function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r,g,b};
}

function rgbToHex(r,g,b) {
  return "#"+[r,g,b].map(v=>v.toString(16).padStart(2,"0")).join("");
}

function previewIdle() {
  // live preview — will be applied on button click
}

function loadIdleFromConfig() {
  const idle = configCache.idle || {r:255,g:200,b:120,brightness:15,on:true};
  document.getElementById("idle-color").value = rgbToHex(idle.r, idle.g, idle.b);
  document.getElementById("idle-brightness").value = idle.brightness || 15;
  document.getElementById("idle-bv").textContent = (idle.brightness||15) + "%";
  document.getElementById("idle-on").checked = idle.on !== false;
}

async function saveIdle() {
  const hex = document.getElementById("idle-color").value;
  const {r,g,b} = hexToRgb(hex);
  const brightness = parseInt(document.getElementById("idle-brightness").value);
  const on = document.getElementById("idle-on").checked;
  const res = await fetch("/api/light/idle", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({r,g,b,brightness,on}),
  });
  const data = await res.json();
  if (data.ok) { configCache.idle = data.idle; }
}

// ─── Alert color editor ────────────────────────────────────────────────────
function renderAlertColorGrid() {
  const overrides  = configCache.alert_colors    || {};
  const durations  = configCache.alert_durations || {};
  const defaultDur = configCache.alert_duration  || 45;
  const grid = document.getElementById("alert-color-grid");
  grid.innerHTML = ALERT_CATS.map(cat => {
    const def    = overrides[cat.cat] || {};
    const hexVal = def.r !== undefined ? rgbToHex(def.r,def.g,def.b) : cat.color;
    const bVal   = def.brightness !== undefined ? def.brightness : 100;
    const dVal   = durations[cat.cat] !== undefined ? durations[cat.cat] : (DEFAULT_DURATIONS[cat.cat] || 45);
    return `
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap">
        <div style="width:10px;height:10px;border-radius:50%;background:${cat.color};flex-shrink:0"></div>
        <span style="flex:1;font-size:13px;min-width:120px">${cat.name}</span>
        <input type="color" id="ac-color-${cat.cat}" value="${hexVal}"
          style="width:36px;height:32px;border:1px solid var(--border);border-radius:6px;background:var(--bg);cursor:pointer;padding:1px 2px">
        <input type="range" id="ac-bright-${cat.cat}" min="1" max="100" value="${bVal}"
          style="width:70px" title="עוצמה">
        <span id="ac-bv-${cat.cat}" style="font-size:11px;color:var(--muted);width:28px">${bVal}%</span>
        <input type="number" id="ac-dur-${cat.cat}" value="${dVal}" min="5" max="3600"
          style="width:52px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);padding:4px 6px;font-size:12px" title="משך (שניות)">
        <span style="font-size:11px;color:var(--muted)">שנ'</span>
        <button onclick="testCategory('${cat.cat}')"
          style="background:var(--border);border:none;color:var(--text);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer">בדוק</button>
      </div>`;
  }).join("");
  ALERT_CATS.forEach(cat => {
    const sl = document.getElementById(`ac-bright-${cat.cat}`);
    if (sl) sl.oninput = () => {
      document.getElementById(`ac-bv-${cat.cat}`).textContent = sl.value + "%";
    };
  });
}

async function saveAlertColors() {
  const colors    = {};
  const durations = {};
  ALERT_CATS.forEach(cat => {
    const hex = document.getElementById(`ac-color-${cat.cat}`).value;
    const {r,g,b} = hexToRgb(hex);
    const brightness = parseInt(document.getElementById(`ac-bright-${cat.cat}`).value);
    const dur = parseInt(document.getElementById(`ac-dur-${cat.cat}`).value);
    colors[cat.cat] = {r,g,b,brightness};
    durations[cat.cat] = dur;
  });
  const res = await fetch("/api/alert/colors", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(colors),
  });
  const data = await res.json();
  if (data.ok) configCache.alert_colors = data.alert_colors;
  await fetch("/api/config", {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({alert_durations: durations}),
  });
  configCache.alert_durations = durations;
}
